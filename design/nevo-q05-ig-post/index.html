  /* Instagram Reels, 1080x1920. One committed visual world: mint ground,
     lavender structure, lime as the single signal colour, ink type.
     Type is sized to stay readable on a phone held at ~30 cm. */
  :root{
    --mint:#A5DBD5;
    --lavender:#CBC9F4;
    --lime:#C9FF3D;
    --ink:#23232E;
    --paper:#F4F2EC;
    --ink-70:rgba(35,35,46,.70);
    --ink-55:rgba(35,35,46,.55);
    --ink-25:rgba(35,35,46,.25);
    --surround:#0E1514;
  }
  html,body{height:100%}
  body{
    margin:0;background:var(--surround);color:var(--ink);
    font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  #viewport{position:fixed;inset:0;display:grid;place-items:center;background:var(--surround);overflow:hidden}
  #stage{
    position:relative;width:1080px;height:1920px;overflow:hidden;
    background:var(--mint);
    transform:scale(var(--s,1));transform-origin:center center;
  }
  .grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(to right,rgba(35,35,46,.05) 1px,transparent 1px),
      linear-gradient(to bottom,rgba(35,35,46,.05) 1px,transparent 1px);
    background-size:48px 48px;
  }

  /* ---------- masthead ---------- */
  .tag{
    position:absolute;left:60px;top:104px;height:60px;display:flex;align-items:center;
    background:var(--ink);color:var(--mint);padding:0 18px;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:26px;font-weight:500;letter-spacing:3px;
  }
  .tag-sub{
    position:absolute;left:300px;top:104px;height:60px;display:flex;align-items:center;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:26px;letter-spacing:3px;color:var(--ink);
  }
  .pill{
    position:absolute;right:60px;top:104px;height:60px;display:flex;align-items:center;gap:12px;
    background:var(--paper);border:3px solid var(--ink);padding:0 20px;box-sizing:border-box;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:22px;font-weight:500;letter-spacing:2.4px;
  }
  .pill .dot{width:16px;height:16px;border-radius:50%;background:var(--lime);border:2px solid var(--ink)}

  .ticks{position:absolute;left:60px;top:196px;width:960px;display:flex;gap:7px}
  .tick{flex:1;height:10px;background:var(--ink-25);overflow:hidden}
  .tick i{display:block;height:100%;width:100%;background:var(--ink);transform-origin:0 50%}

  /* ---------- hook: the number that changes every second ---------- */
  .value-window{position:absolute;left:56px;top:236px;width:968px;height:196px;overflow:hidden}
  .value-roll{height:196px;will-change:transform}
  .value{
    display:block;font-family:"Archivo Black",Archivo,"Helvetica Neue",Arial,sans-serif;
    font-size:172px;line-height:196px;letter-spacing:-7px;color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .unit{
    position:absolute;left:60px;top:450px;height:60px;display:inline-flex;align-items:center;
    background:var(--lime);border:3px solid var(--ink);padding:0 18px;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:28px;font-weight:500;letter-spacing:3px;color:var(--ink);
  }
  .headline{
    position:absolute;left:60px;top:534px;width:960px;
    font-size:62px;font-weight:700;font-stretch:105%;letter-spacing:-1.4px;line-height:1.02;
  }
  .note{
    position:absolute;left:60px;top:620px;width:960px;
    font-size:38px;font-weight:400;line-height:1.3;color:var(--ink-70);
  }

  /* ---------- hero: the car, contained so nothing gets clipped ---------- */
  .hero{position:absolute;left:0;top:700px;width:1080px;height:360px}
  .band{
    position:absolute;left:-160px;top:96px;width:1420px;height:172px;
    background:var(--lavender);border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);
    transform:rotate(-7deg);will-change:transform;
  }
  .band::after{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(180deg,transparent 0 46px,rgba(35,35,46,.28) 46px 47px);
  }
  .car{
    position:absolute;left:20px;top:0;width:1040px;height:360px;
    display:flex;align-items:center;justify-content:center;
  }
  .car img{max-width:100%;max-height:100%;object-fit:contain;display:block;will-change:transform}
  /* the cutout lost its ground shadow, so the pair gets a soft contact shadow back */
  .ground{
    position:absolute;left:20px;top:296px;width:1040px;height:48px;
    background:
      radial-gradient(ellipse 19% 42% at 26% 50%,rgba(35,35,46,.26),transparent 74%),
      radial-gradient(ellipse 19% 42% at 73% 52%,rgba(35,35,46,.26),transparent 74%);
  }

  /* ---------- spec roller ---------- */
  .card{
    position:absolute;left:60px;top:1100px;width:960px;height:480px;
    background:var(--paper);border:4px solid var(--ink);box-sizing:border-box;
  }
  .card-head{
    position:absolute;left:0;top:0;width:100%;height:62px;box-sizing:border-box;
    background:var(--lavender);border-bottom:4px solid var(--ink);
    display:flex;align-items:center;justify-content:space-between;padding:0 24px;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:24px;font-weight:500;letter-spacing:3px;color:var(--ink);
  }
  .roller{
    position:absolute;left:0;top:62px;width:100%;height:418px;overflow:hidden;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 13%,#000 87%,transparent 100%);
    mask-image:linear-gradient(180deg,transparent 0,#000 13%,#000 87%,transparent 100%);
  }
  .row{

    <div class="card">
      <div class="card-head"><span>SPESIFIKASI</span><span>SMART DRIVE, EASY LIFE.</span></div>
      <div class="cursor"></div>
      <div class="roller" id="roller"></div>
    </div>

    <div class="wordmark">NEVO Q05</div>
  </div>
</div>

<script>
(() => {
  "use strict";

  // Every figure below comes from the official Nevo Q05 flyer
  // (PT Dinamika Indomobil Transportasi, 26/07/26).
  const FEATURES = [
    { name:"Jarak Tempuh",    row:"462 km",    value:"462",   unit:"KM \u00B7 NEDC",
      note:"Sekali isi penuh untuk rutinitas berhari-hari." },
    { name:"Fast Charging",   row:"15 menit",  value:"15",    unit:"MENIT 30\u201380%",
      note:"3C fast charging: 30% ke 80% dalam 15 menit." },
    { name:"Baterai LFP",     row:"51,9 kWh",  value:"51,9",  unit:"KWH \u00B7 LFP",
      note:"Lithium Iron Phosphate, aman dan tahan lama." },
    { name:"Tenaga Motor",    row:"120 kW",    value:"120",   unit:"KW \u00B7 190 NM",
      note:"Motor sinkron magnet permanen, penggerak depan." },
    { name:"Wheelbase",       row:"2.735 mm",  value:"2.735", unit:"MM WHEELBASE",
      note:"Terpanjang di kelasnya, kabin terasa lega." },
    { name:"Head Unit",       row:"14,6 inci", value:"14,6",  unit:"INCI TOUCHSCREEN",
      note:"Plus cluster digital 10,17 inci." },
    { name:"Fitur ADAS",      row:"12 fungsi", value:"12",    unit:"FUNGSI ADAS \u00B7 L2",
      note:"3 radar mm-wave, 5 kamera, 3 sensor ultrasonik." },
    { name:"Koefisien Drag",  row:"0,265 Cd",  value:"0,265", unit:"CD KOEFISIEN DRAG",
      note:"Serendah 0,265 Cd, terbaik di segmennya." },
    { name:"Ruang Simpan",    row:"27 titik",  value:"27",    unit:"RUANG SIMPAN",
      note:"27 tempat simpan supaya kabin tetap rapi." },
    { name:"Garansi Baterai", row:"8 tahun",   value:"8",     unit:"TAHUN / 240.000 KM",
      note:"Kendaraan 5 tahun atau 150.000 km." }
  ];

  const N     = FEATURES.length; // 10 rows
  const DUR   = 10;              // 10 second loop - one feature per second
  const ROW   = 94;              // row height (px)
  const CY    = 209;             // centre of the roller viewport (matches .cursor)
  const SNAP  = 0.45;            // the roller travels one row in the first 45% of a beat
  const LEAD  = 0.28;            // the hook starts its swap this early

  const roller = document.getElementById('roller');
  const rows = [];
  for (let i = 0; i < N; i++) {
    const f = FEATURES[(N - i) % N];   // row i carries the feature that lands i beats from now
    const el = document.createElement('div');
    el.className = 'row';
    el.innerHTML = '<span class="name"></span><span class="val"></span>';
    el.querySelector('.name').textContent = f.name;
    el.querySelector('.val').textContent = f.row;
    roller.appendChild(el);
    rows.push({ el, name: el.querySelector('.name'), val: el.querySelector('.val') });
  }

  const ticksWrap = document.getElementById('ticks');
  const ticks = [];
  for (let i = 0; i < N; i++) {
    const t = document.createElement('span');
    t.className = 'tick';
    t.innerHTML = '<i></i>';
    ticksWrap.appendChild(t);
    ticks.push(t.firstChild);
  }

  const valueRoll = document.getElementById('valueRoll');
  const specValue = document.getElementById('specValue');
  const specUnit = document.getElementById('specUnit');
  const specTitle = document.getElementById('specTitle');
  const specNote = document.getElementById('specNote');
  const band = document.getElementById('band');
  const carimg = document.getElementById('carimg');

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const wrapSlot = (s) => { s = ((s % N) + N) % N; return s > N / 2 ? s - N : s; };

  const detent = (f) => { const k = clamp(f / SNAP, 0, 1); return 1 - Math.pow(1 - k, 5); };
  const easeOut = (k) => 1 - Math.pow(1 - clamp(k, 0, 1), 3);

  function render(t) {
    t = ((t % DUR) + DUR) % DUR;
    const beat = Math.floor(t), frac = t - beat;
    const progress = beat + detent(frac);
    const cycle = t / DUR * Math.PI * 2;   // ambient sine, one full turn per loop

    // --- roller ---
    for (let i = 0; i < N; i++) {
      const s = wrapSlot(i + progress);
      const sel = clamp(1 - Math.abs(s) / 1.05, 0, 1);
      const r = rows[i];
      r.el.style.transform = 'translateY(' + (CY + s * ROW - ROW / 2).toFixed(2) + 'px)';
      r.name.style.opacity = (0.58 + 0.42 * sel).toFixed(3);
      r.val.style.opacity = (0.52 + 0.48 * sel).toFixed(3);
    }

    // --- hook: the value rolls like an odometer as the row lands on the cursor ---
    const u = t + LEAD - SNAP;
    const fb = Math.floor(u), fp = u - fb;
    const idx = (((fb + 1) % N) + N) % N;
    const OUT = 0.13, IN = 0.34;

    let roll, fade, rise, show;
    if (fp < OUT) {
      const k = easeOut(fp / OUT);
      show = FEATURES[(idx - 1 + N) % N];
      roll = -196 * k; fade = 1 - k; rise = -7 * k;
    } else {
      const k = easeOut((fp - OUT) / (IN - OUT));
      show = FEATURES[idx];
      roll = 196 * (1 - k); fade = k; rise = 9 * (1 - k);
    }
    specValue.textContent = show.value;
    specUnit.textContent = show.unit;
    specTitle.textContent = show.name;
    specNote.textContent = show.note;
    valueRoll.style.transform = 'translateY(' + roll.toFixed(2) + 'px)';
    specUnit.style.opacity = fade.toFixed(3);
    specTitle.style.opacity = fade.toFixed(3);
    specTitle.style.transform = 'translateY(' + rise.toFixed(2) + 'px)';
    specNote.style.opacity = (fade * .95).toFixed(3);
    specNote.style.transform = 'translateY(' + (rise * .5).toFixed(2) + 'px)';

    // --- progress ticks: the active segment fills across its own second ---
    for (let i = 0; i < N; i++) {
      ticks[i].style.transform = 'scaleX(' + (i < idx ? 1 : i === idx ? fp : 0).toFixed(3) + ')';
      ticks[i].style.opacity = i < idx ? '.4' : '1';
    }

    // --- ambient drift, sine-driven so the loop stays seamless ---
    band.style.transform = 'rotate(-7deg) translateX(' + (Math.sin(cycle) * 16).toFixed(2) + 'px)';
    carimg.style.transform = 'translateY(' + (Math.sin(cycle) * -8).toFixed(2) +
      'px) scale(' + (1 + 0.014 * (0.5 - 0.5 * Math.cos(cycle))).toFixed(4) + ')';
  }

  function fit() {
    document.getElementById('stage').style.setProperty('--s', Math.min(innerWidth / 1080, innerHeight / 1920));
  }
  addEventListener('resize', fit);
  fit();

  let raf = 0;
  const t0 = performance.now();
  (function frame(now) { render((now - t0) / 1000); raf = requestAnimationFrame(frame); })(t0);

  // deterministic frame rendering, used by the video exporter
  window.__setTime = (t) => { if (raf) { cancelAnimationFrame(raf); raf = 0; } render(t); };
})();
</script>
