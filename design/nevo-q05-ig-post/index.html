  /* Instagram 4:5 post. One committed visual world: mint ground, lavender
     structure, lime as the single signal colour, everything else ink. */
  :root{
    --mint:#A5DBD5;
    --lavender:#CBC9F4;
    --lime:#C9FF3D;
    --ink:#12121B;
    --paper:#F4F2EC;
    --ink-45:rgba(18,18,27,.45);
    --ink-20:rgba(18,18,27,.20);
    --surround:#0E1514;
  }
  html,body{height:100%}
  body{
    margin:0;background:var(--surround);color:var(--ink);
    font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  #viewport{position:fixed;inset:0;display:grid;place-items:center;background:var(--surround);overflow:hidden}
  #stage{
    position:relative;width:1080px;height:1350px;overflow:hidden;
    background:var(--mint);
    transform:scale(var(--s,1));transform-origin:center center;
  }
  .grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(to right,rgba(18,18,27,.055) 1px,transparent 1px),
      linear-gradient(to bottom,rgba(18,18,27,.055) 1px,transparent 1px);
    background-size:36px 36px;
  }

  /* ---------- masthead ---------- */
  .tag{
    position:absolute;left:56px;top:44px;height:34px;display:flex;align-items:center;
    background:var(--ink);color:var(--mint);padding:0 12px;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:14px;font-weight:500;letter-spacing:2.4px;
  }
  .tag-sub{
    position:absolute;left:206px;top:44px;height:34px;display:flex;align-items:center;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:14px;letter-spacing:2.4px;color:var(--ink);
  }
  .slug{
    position:absolute;right:56px;top:44px;text-align:right;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:12.5px;line-height:1.45;letter-spacing:1.8px;color:var(--ink-45);
  }
  .ticks{position:absolute;left:56px;top:100px;display:flex;gap:6px}
  .tick{width:91px;height:4px;background:var(--ink-20);overflow:hidden}
  .tick i{display:block;height:100%;width:100%;background:var(--ink);transform-origin:0 50%}

  /* ---------- hook: the spec number that changes every second ---------- */
  .value-window{position:absolute;left:52px;top:132px;width:330px;height:132px;overflow:hidden}
  .value-roll{height:132px;will-change:transform}
  .value{
    display:block;font-family:"Archivo Black",Archivo,"Helvetica Neue",Arial,sans-serif;
    font-size:118px;line-height:132px;letter-spacing:-5px;color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .unit{
    position:absolute;left:396px;top:150px;height:32px;display:inline-flex;align-items:center;
    background:var(--lime);border:2px solid var(--ink);padding:0 12px;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:14px;font-weight:500;letter-spacing:2px;color:var(--ink);
  }
  .headline{
    position:absolute;left:396px;top:196px;width:628px;
    font-size:38px;font-weight:700;font-stretch:105%;letter-spacing:-.8px;line-height:1.05;
  }
  .note{
    position:absolute;left:396px;top:246px;width:600px;
    font-size:17px;font-weight:400;line-height:1.4;color:var(--ink-45);
  }

  /* ---------- hero: the car, contained so nothing gets clipped ---------- */
  .hero{position:absolute;left:0;top:300px;width:1080px;height:520px}
  .band{
    position:absolute;left:-140px;top:212px;width:1360px;height:150px;
    background:var(--lavender);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);
    transform:rotate(-7deg);will-change:transform;
  }
  .band::after{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(180deg,transparent 0 36px,rgba(18,18,27,.30) 36px 37px);
  }
  .car{
    position:absolute;left:24px;top:6px;width:1032px;height:508px;
    display:flex;align-items:center;justify-content:center;
  }
  .car img{max-width:100%;max-height:100%;object-fit:contain;display:block;will-change:transform}

  /* ---------- spec roller ---------- */
  .card{
    position:absolute;left:56px;top:836px;width:968px;height:420px;
    background:var(--paper);border:2.5px solid var(--ink);box-sizing:border-box;
  }
  .card-head{
    position:absolute;left:0;top:0;width:100%;height:36px;box-sizing:border-box;
    background:var(--lavender);border-bottom:2.5px solid var(--ink);
    display:flex;align-items:center;justify-content:space-between;padding:0 16px;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:13px;font-weight:500;letter-spacing:2.2px;color:var(--ink);
  }
  .roller{
    position:absolute;left:0;top:36px;width:100%;height:379px;overflow:hidden;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 84%,transparent 100%);
    mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 84%,transparent 100%);
  }
  .row{
    position:absolute;left:0;top:0;width:100%;height:58px;box-sizing:border-box;
    display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 20px;
    will-change:transform;
  }
  .row .name{font-size:25px;font-weight:600;letter-spacing:-.3px;white-space:nowrap}
  .row .val{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:15px;font-weight:500;letter-spacing:.6px;white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .cursor{
    position:absolute;left:0;top:197px;width:100%;height:58px;box-sizing:border-box;
    background:var(--lime);border-top:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);

    <div class="card">
      <div class="card-head"><span>SPESIFIKASI</span><span>SUV LISTRIK &middot; BEV</span></div>
      <div class="cursor"></div>
      <div class="roller" id="roller"></div>
    </div>

    <div class="pill"><span class="dot"></span>100% ELECTRIC</div>
    <div class="credit">Konsep konten &middot; data spesifikasi publik, Agustus 2026</div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const FEATURES = [
    { name:"Jarak Tempuh",     row:"462 km",   value:"462",  unit:"KM \u00B7 NEDC",
      note:"Sekali pengisian penuh, cukup untuk rutinitas kota berhari-hari." },
    { name:"Fast Charging",    row:"15 menit", value:"15",   unit:"MENIT 30\u201380%",
      note:"DC fast charging dari 30% ke 80% hanya dalam 15 menit." },
    { name:"Baterai CATL LFP", row:"51,9 kWh", value:"51,9", unit:"KWH \u00B7 LFP",
      note:"Lithium iron phosphate CATL \u2014 stabil dan tahan siklus pengisian." },
    { name:"Tenaga Motor",     row:"120 kW",   value:"120",  unit:"KW \u00B7 190 NM",
      note:"Torsi instan 190 Nm sejak putaran pertama, tanpa jeda transmisi." },
    { name:"Kapasitas Bagasi", row:"540 L",    value:"540",  unit:"LITER BAGASI",
      note:"540 liter, mengembang sampai 1.380 liter saat kursi belakang dilipat." },
    { name:"Head Unit",        row:"14,6 inci",value:"14,6", unit:"INCI LAYAR",
      note:"Layar 1080P HD, berpasangan dengan cluster digital 10,17 inci." },
    { name:"Surround View",    row:"540\u00B0",value:"540",  unit:"DERAJAT KAMERA",
      note:"Kamera 540 derajat plus transparent chassis untuk manuver sempit." },
    { name:"Airbag & ADAS",    row:"6 + L2",   value:"6",    unit:"AIRBAG \u00B7 ADAS L2",
      note:"Enam airbag dan ADAS Level 2 sebagai standar keselamatan aktif." },
    { name:"Panoramic Roof",   row:"1,8 m\u00B2", value:"1,8", unit:"M\u00B2 PANORAMIC",
      note:"Atap panoramik dengan electric sunshade pada varian Max." },
    { name:"Garansi Baterai",  row:"8 tahun",  value:"8",    unit:"TAHUN / 240.000 KM",
      note:"Garansi baterai 8 tahun; kendaraan 5 tahun atau 150.000 km." }
  ];

  const N     = FEATURES.length; // 10 rows
  const DUR   = 10;              // 10 second loop \u2014 one feature per second
  const ROW   = 58;              // row height (px)
  const CY    = 190;             // centre of the roller viewport (matches .cursor)
  const SNAP  = 0.45;            // the roller travels one row in the first 45% of a beat
  const LEAD  = 0.28;            // the hook starts its swap this early

  const roller = document.getElementById('roller');
  const rows = [];
  for (let i = 0; i < N; i++) {
    const f = FEATURES[(N - i) % N];   // row i carries the feature that lands i beats from now
    const el = document.createElement('div');
    el.className = 'row';
    el.innerHTML = '<span class="name"></span><span class="val"></span>';
    el.querySelector('.name').textContent = f.name;
    el.querySelector('.val').textContent = f.row;
    roller.appendChild(el);
    rows.push({ el, name: el.querySelector('.name'), val: el.querySelector('.val') });
  }

  const ticksWrap = document.getElementById('ticks');
  const ticks = [];
  for (let i = 0; i < N; i++) {
    const t = document.createElement('span');
    t.className = 'tick';
    t.innerHTML = '<i></i>';
    ticksWrap.appendChild(t);
    ticks.push(t.firstChild);
  }

  const valueRoll = document.getElementById('valueRoll');
  const specValue = document.getElementById('specValue');
  const specUnit = document.getElementById('specUnit');
  const specTitle = document.getElementById('specTitle');
  const specNote = document.getElementById('specNote');
  const band = document.getElementById('band');
  const carimg = document.getElementById('carimg');

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const wrapSlot = (s) => { s = ((s % N) + N) % N; return s > N / 2 ? s - N : s; };

  const detent = (f) => { const k = clamp(f / SNAP, 0, 1); return 1 - Math.pow(1 - k, 5); };
  const easeOut = (k) => 1 - Math.pow(1 - clamp(k, 0, 1), 3);

  function render(t) {
    t = ((t % DUR) + DUR) % DUR;
    const beat = Math.floor(t), frac = t - beat;
    const progress = beat + detent(frac);
    const cycle = t / DUR * Math.PI * 2;   // ambient sine, one full turn per loop

    // --- roller ---
    for (let i = 0; i < N; i++) {
      const s = wrapSlot(i + progress);
      const sel = clamp(1 - Math.abs(s) / 1.05, 0, 1);
      const r = rows[i];
      r.el.style.transform = 'translateY(' + (CY + s * ROW - ROW / 2).toFixed(2) + 'px)';
      r.name.style.opacity = (0.42 + 0.58 * sel).toFixed(3);
      r.val.style.opacity = (0.38 + 0.62 * sel).toFixed(3);
    }

    // --- hook: value rolls like an odometer as the row lands on the cursor ---
    const u = t + LEAD - SNAP;
    const fb = Math.floor(u), fp = u - fb;
    const idx = (((fb + 1) % N) + N) % N;
    const OUT = 0.13, IN = 0.34;

    let roll, fade, rise, show;
    if (fp < OUT) {
      const k = easeOut(fp / OUT);
      show = FEATURES[(idx - 1 + N) % N];
      roll = -132 * k; fade = 1 - k; rise = -5 * k;
    } else {
      const k = easeOut((fp - OUT) / (IN - OUT));
      show = FEATURES[idx];
      roll = 132 * (1 - k); fade = k; rise = 6 * (1 - k);
    }
    specValue.textContent = show.value;
    specUnit.textContent = show.unit;
    specTitle.textContent = show.name;
    specNote.textContent = show.note;
    valueRoll.style.transform = 'translateY(' + roll.toFixed(2) + 'px)';
    specUnit.style.opacity = fade.toFixed(3);
    specTitle.style.opacity = fade.toFixed(3);
    specTitle.style.transform = 'translateY(' + rise.toFixed(2) + 'px)';
    specNote.style.opacity = (fade * .95).toFixed(3);
    specNote.style.transform = 'translateY(' + (rise * .5).toFixed(2) + 'px)';

    // --- progress ticks: the active segment fills across its own second ---
    for (let i = 0; i < N; i++) {
      ticks[i].style.transform = 'scaleX(' + (i < idx ? 1 : i === idx ? fp : 0).toFixed(3) + ')';
      ticks[i].style.opacity = i < idx ? '.35' : '1';
    }

    // --- ambient drift, sine-driven so the loop stays seamless ---
    band.style.transform = 'rotate(-7deg) translateX(' + (Math.sin(cycle) * 14).toFixed(2) + 'px)';
    carimg.style.transform = 'translateY(' + (Math.sin(cycle) * -7).toFixed(2) +
      'px) scale(' + (1 + 0.012 * (0.5 - 0.5 * Math.cos(cycle))).toFixed(4) + ')';
  }

  function fit() {
    document.getElementById('stage').style.setProperty('--s', Math.min(innerWidth / 1080, innerHeight / 1350));
  }
  addEventListener('resize', fit);
  fit();

  let raf = 0;
  const t0 = performance.now();
  (function frame(now) { render((now - t0) / 1000); raf = requestAnimationFrame(frame); })(t0);

  // deterministic frame rendering, used by the video exporter
  window.__setTime = (t) => { if (raf) { cancelAnimationFrame(raf); raf = 0; } render(t); };
})();
</script>
