<title>TIGGO V Feature Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --green-bg:#14400F;
    --yellow:#F6E96B;
    --red:#D8431F;
    --mint:#6FE39B;
    --crimson:#B8341B;
  }
  html,body{height:100%}
  body{
    margin:0;
    background:var(--green-bg);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #viewport{position:fixed;inset:0;display:grid;place-items:center;background:var(--green-bg);overflow:hidden}
  #stage{
    position:relative;width:1600px;height:900px;overflow:hidden;
    background:var(--green-bg);
    transform:scale(var(--s,1));transform-origin:center center;
  }

  /* ---------- left: yellow panel ---------- */
  .panel{
    position:absolute;left:100px;top:88px;width:756px;height:736px;
    background:var(--yellow);border-radius:26px;
    will-change:transform;
  }
  .card{
    position:absolute;left:50%;top:25px;width:327px;height:424px;
    margin-left:-163.5px;
    background:var(--red);border-radius:18px;
    box-shadow:0 18px 34px -18px rgba(20,64,15,.55), 0 2px 0 0 rgba(0,0,0,.14);
    padding:22px;box-sizing:border-box;
    display:flex;flex-direction:column;
    overflow:hidden;
    will-change:transform;
  }
  .photo{
    width:100%;height:150px;border-radius:6px;overflow:hidden;
    background:#9a2f13;flex:none;position:relative;
  }
  .photo img{
    width:100%;height:100%;object-fit:cover;object-position:50% 58%;display:block;
    will-change:transform;
  }
  .photo::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(216,67,31,.20),rgba(216,67,31,.05) 45%,rgba(150,35,12,.32));
    mix-blend-mode:multiply;
  }
  .titles{margin-top:26px;min-height:74px}
  .overline{
    font-family:"Instrument Serif",Georgia,"Times New Roman",serif;
    font-size:22px;line-height:1.1;color:#F4B6A2;letter-spacing:.2px;
  }
  .headline{
    font-size:25px;line-height:1.18;font-weight:600;color:#fff;letter-spacing:-.3px;
    margin-top:3px;
  }
  .meta{display:flex;justify-content:space-between;gap:14px;margin-top:26px}
  .meta .col{min-width:0}
  .meta .col.right{text-align:right}
  .lbl{
    display:block;font-size:10px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;
    color:rgba(255,255,255,.62);
  }
  .val{display:block;margin-top:6px;font-size:15.5px;font-weight:500;color:#fff;white-space:nowrap}
  .rule{margin-top:auto;height:1px;background:rgba(255,255,255,.30)}

  /* thin edge bar + mono caption below the card */
  .edge{
    position:absolute;left:50%;top:548px;width:386px;height:11px;margin-left:-193px;
    background:linear-gradient(180deg,#2b2b2b,#101010 55%,#000);
    border-radius:0 0 9px 9px;
    box-shadow:0 1px 0 rgba(0,0,0,.35);
  }
  .edge::before{
    content:"";position:absolute;left:6px;right:6px;top:-2px;height:3px;
    background:repeating-linear-gradient(90deg,rgba(246,233,107,.9) 0 2px,rgba(30,30,30,.9) 2px 4px);
    border-radius:2px;opacity:.85;
  }
  .mono-cap{
    position:absolute;left:0;right:0;top:568px;text-align:center;
    font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12px;letter-spacing:.2px;color:var(--crimson);
  }

  /* ---------- right: feature wheel ---------- */
  .wheel{position:absolute;left:0;top:0;width:1600px;height:900px;pointer-events:none}
  .item{
    position:absolute;left:0;top:0;white-space:nowrap;
    transform-origin:0 50%;
    font-size:47px;font-weight:600;letter-spacing:-.7px;line-height:1.05;
    color:var(--mint);
    will-change:transform,opacity;
  }
  .dot{
    position:absolute;left:936px;top:452px;width:19px;height:19px;margin:-9.5px 0 0 -9.5px;
    border-radius:50%;background:var(--mint);
  }
  .ring{
    position:absolute;left:936px;top:452px;width:19px;height:19px;margin:-9.5px 0 0 -9.5px;
    border-radius:50%;border:2px solid var(--mint);
  }

  /* ---------- footer ---------- */
  .footer{
    position:absolute;left:100px;top:852px;
    font-family:"JetBrains Mono",ui-monospace,monospace;
    font-size:12.5px;letter-spacing:.4px;color:rgba(111,227,155,.55);
  }
  .footer b{color:rgba(111,227,155,.9);font-weight:500}
</style>

<div id="viewport">
  <div id="stage">
    <div class="panel" id="panel">
      <div class="card" id="card">
        <div class="photo"><img id="carimg" src="__CAR_IMAGE__" alt="Chery TIGGO V di GIIAS 2026"></div>
        <div class="titles">
          <div class="overline">TIGGO V</div>
          <div class="headline" id="headline">3-in-1 Versatility</div>
        </div>
        <div class="meta">
          <div class="col">
            <span class="lbl">Fitur</span>
            <span class="val" id="metaIndex">01 / 10</span>
          </div>
          <div class="col right">
            <span class="lbl">Spesifikasi</span>
            <span class="val" id="metaSpec">SUV &middot; MPV &middot; Double Cab</span>
          </div>
        </div>
        <div class="rule"></div>
      </div>
      <div class="edge" id="edge"></div>
      <div class="mono-cap" id="monoCap">versatility: suv + mpv + double-cab</div>
    </div>

    <div class="wheel" id="wheel">
      <div class="ring" id="ring"></div>
      <div class="dot" id="dot"></div>
    </div>

    <div class="footer"><b>CHERY TIGGO V</b> &nbsp;&middot;&nbsp; specially built for indonesia &nbsp;&middot;&nbsp; giias 2026</div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const FEATURES = [
    { label:"3-in-1 Versatility",      title:"3-in-1 Versatility",   spec:"SUV · MPV · Double Cab", mono:"versatility: suv + mpv + double-cab" },
    { label:"Ground Clearance 220 mm", title:"Ground Clearance",     spec:"220 mm",                  mono:"ground-clearance: 220mm" },
    { label:"Tanjakan 41°",       title:"Kemampuan Menanjak",   spec:"41°",                mono:"gradeability: 41deg" },
    { label:"Wading 700 mm",           title:"Lintas Genangan",      spec:"700 mm",                  mono:"wading-depth: 700mm" },
    { label:"Easy Turn",               title:"Easy Turn",            spec:"radius −0,5 m",      mono:"turning-radius: -0.5m" },
    { label:"Air Flow Calibration",    title:"Air Flow Calibration", spec:"Baris 3 & Pilar C",       mono:"cabin-airflow: row3 + c-pillar" },
    { label:"Kabin 2·4·5·7 Kursi", title:"Kabin Fleksibel", spec:"2 · 4 · 5 · 7 Kursi", mono:"seat-layout: 2 | 4 | 5 | 7 + bed" },
    { label:"Super Hybrid 1.030 km",   title:"Chery Super Hybrid",   spec:"1.030 km",                mono:"range: 1030km / thermal-eff 42.5%" },
    { label:"Split Tailgate 250 kg",   title:"Split Tailgate",       spec:"250 kg",                  mono:"tailgate-load: 250kg" },
    { label:"Vehicle-to-Load 2,2 kW",  title:"Vehicle-to-Load",      spec:"2,2 kW",                  mono:"v2l-output: 2.2kW" }
  ];

  const N     = FEATURES.length;  // 10 rows
  const DUR   = 10;               // 10 second loop — one feature per second
  const SLOT  = 88;               // vertical distance between rows (px)
  const ROT   = 2.3;              // degrees of tilt per row
  const CURVE = 4.6;              // horizontal arc strength (px per row squared)
  const CX    = 1006;             // x of the centre row
  const CY    = 452;              // y of the centre row

  const wheel = document.getElementById('wheel');
  const nodes = [];
  for (let i = 0; i < N; i++) {
    const el = document.createElement('div');
    el.className = 'item';
    // row i carries feature (N - i) % N so the selection runs 1 -> 10 while the list travels down
    el.textContent = FEATURES[(N - i) % N].label;
    wheel.appendChild(el);
    nodes.push(el);
  }

  const headline  = document.getElementById('headline');
  const metaIndex = document.getElementById('metaIndex');
  const metaSpec  = document.getElementById('metaSpec');
  const monoCap   = document.getElementById('monoCap');
  const dot       = document.getElementById('dot');
  const ring      = document.getElementById('ring');
  const panel     = document.getElementById('panel');
  const card      = document.getElementById('card');
  const carimg    = document.getElementById('carimg');
  const edge      = document.getElementById('edge');

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const wrapSlot = (s) => { s = ((s % N) + N) % N; return s > N / 2 ? s - N : s; };
  const mix = (a, b, t) => a + (b - a) * t;

  // snappy picker easing: travels one row in the first 62% of the beat, then rests
  function snap(f) {
    const k = clamp(f / 0.62, 0, 1);
    return k < 0.5 ? 8 * k * k * k * k : 1 - Math.pow(-2 * k + 2, 4) / 2;
  }

  const MINT    = [111, 227, 155];
  const MINT_HI = [173, 241, 203];

  function render(t) {
    t = ((t % DUR) + DUR) % DUR;
    const beat = Math.floor(t);
    const frac = t - beat;
    const progress = beat + snap(frac);
    const cycle = t / DUR * Math.PI * 2;   // seamless ambient sine over the loop

    // --- the wheel ---
    for (let i = 0; i < N; i++) {
      const s = wrapSlot(i + progress);
      const a = Math.abs(s);
      const x = CX - CURVE * s * s;
      const y = CY + s * SLOT;
      const fade = clamp((4.9 - a) / 1.3, 0, 1);
      const sel = clamp(1 - a / 1.15, 0, 1);
      const c = [0, 1, 2].map(j => Math.round(mix(MINT[j], MINT_HI[j], sel * sel)));
      const n = nodes[i];
      n.style.transform = 'translate(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px) translateY(-50%) rotate(' + (s * ROT).toFixed(3) + 'deg)';
      n.style.opacity = (fade * (0.82 + 0.18 * sel)).toFixed(3);
      n.style.color = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
    }

    // --- card copy, swapped in sync with the row landing on the dot ---
    const OUT = 0.20, IN = 0.52;
    const tc = t + 0.62;                 // the wheel lands 0.62s into each beat
    const beatC = Math.floor(tc), fracC = tc - beatC;
    let idx, op, dy;
    if (fracC < OUT) {
      const u = fracC / OUT;
      idx = (beatC - 1 + N) % N; op = 1 - u; dy = 8 * u;
    } else {
      const u = clamp((fracC - OUT) / (IN - OUT), 0, 1);
      idx = beatC % N; op = u; dy = -10 * (1 - u);
    }
    const f = FEATURES[idx];
    headline.textContent = f.title;
    metaIndex.textContent = String(idx + 1).padStart(2, '0') + ' / 10';
    metaSpec.textContent = f.spec;
    monoCap.textContent = f.mono;
    headline.style.opacity = op.toFixed(3);
    headline.style.transform = 'translateY(' + dy.toFixed(2) + 'px)';
    for (const el of [metaIndex, metaSpec]) {
      el.style.opacity = op.toFixed(3);
      el.style.transform = 'translateY(' + (dy * 0.6).toFixed(2) + 'px)';
    }
    monoCap.style.opacity = op.toFixed(3);

    // --- selection dot tick ---
    const pulse = Math.pow(clamp(1 - frac / 0.5, 0, 1), 2);
    dot.style.transform = 'scale(' + (1 + 0.42 * pulse).toFixed(3) + ')';
    ring.style.transform = 'scale(' + (1 + 2.4 * (1 - pulse)).toFixed(3) + ')';
    ring.style.opacity = (0.5 * pulse).toFixed(3);

    // --- ambient breathing, sine-driven so the loop stays seamless ---
    panel.style.transform = 'translateY(' + (Math.sin(cycle) * 4).toFixed(2) + 'px)';
    card.style.transform = 'translateY(' + (Math.sin(cycle + 0.6) * 5).toFixed(2) + 'px) scale(' + (1 + 0.006 * Math.sin(cycle)).toFixed(4) + ')';
    carimg.style.transform = 'scale(' + (1.05 + 0.035 * (0.5 - 0.5 * Math.cos(cycle))).toFixed(4) + ')';
    edge.style.transform = 'scaleX(' + (1 - 0.02 * (0.5 - 0.5 * Math.cos(cycle))).toFixed(4) + ')';
  }

  function fit() {
    const s = Math.min(innerWidth / 1600, innerHeight / 900);
    document.getElementById('stage').style.setProperty('--s', s);
  }
  addEventListener('resize', fit);
  fit();

  let raf = 0;
  const t0 = performance.now();
  function frame(now) {
    render((now - t0) / 1000);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);

  // deterministic frame rendering, used by the video exporter
  window.__setTime = (t) => { if (raf) { cancelAnimationFrame(raf); raf = 0; } render(t); };
})();
</script>
